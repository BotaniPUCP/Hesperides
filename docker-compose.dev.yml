# Development override: exposes db and data-service to the host for
# inspection (DBeaver, curl) and mounts source code for hot reload.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    environment:
      SPRING_PROFILES_ACTIVE: dev

  # NOTE: the frontend runtime image (see frontend/Dockerfile) only contains
  # the Next.js standalone build output (server.js, package.json,
  # node_modules, .next/), not the full dev toolchain, so there is no
  # source directory here to mount for hot reload. NODE_ENV is intentionally
  # not overridden either: the image bakes ENV NODE_ENV=production at build
  # time and runs the pre-built `node server.js`, so no dev process reads
  # NODE_ENV at runtime. Real hot reload/Fast Refresh would require adding a
  # separate `dev` stage to the Dockerfile that runs `next dev` instead.
  frontend: {}

  data-service:
    environment:
      FLASK_DEBUG: "1"
      DATA_SERVICE_PORT: ${DATA_SERVICE_PORT:-5001}
    ports:
      - "${DATA_SERVICE_PORT:-5001}:${DATA_SERVICE_PORT:-5001}"
    volumes:
      - ./services:/app
