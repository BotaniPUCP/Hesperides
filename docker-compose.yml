# Base orchestration for the four Hesperides services.
# Only `backend` and `frontend` are reachable from the host here;
# `db` and `data-service` stay internal to the `hesperides-net` network.
# Development-only exposure and hot reload live in docker-compose.dev.yml.

services:
  db:
    # PostGIS, no postgres a secas: el catastro georreferenciado (SPEC-002)
    # usa columnas GEOMETRY. La imagen es Debian, no Alpine, y pesa mas.
    image: postgis/postgis:16-3.4
    container_name: hesperides-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hesperides}
      POSTGRES_USER: ${POSTGRES_USER:-hesperides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hesperides} -d ${POSTGRES_DB:-hesperides}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hesperides-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hesperides-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-hesperides}
      POSTGRES_USER: ${POSTGRES_USER:-hesperides}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar_en_local}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      # Sin valor por defecto a proposito: si falta, el backend no arranca en
      # vez de firmar los JWT con una clave conocida (SPEC-001 §9).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio, definelo en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Relay SMTP de Brevo. Sin credenciales en el .env el envio falla y las
      # altas quedan en PENDING_DELIVERY, que es el comportamiento que SPEC-100
      # §5.3 exige: un correo que no sale no impide registrar a nadie.
      SMTP_HOST: ${SMTP_HOST:-smtp-relay.brevo.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_FROM: ${SMTP_FROM:-no-reply@hesperides.local}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Not yet read by any Java code; scaffolding for when the backend calls the Flask data service.
      DATA_SERVICE_URL: ${DATA_SERVICE_URL:-http://data-service:5001}
    ports:
      - "${BACKEND_PORT:-8080}:${BACKEND_PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hesperides-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      # NEXT_PUBLIC_API_URL is a build-time value in Next.js: it gets inlined
      # into the client bundle by `npm run build`, so it must be passed as a
      # build arg here, not as a runtime `environment:` entry (which the
      # already-built bundle would simply ignore).
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: hesperides-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - hesperides-net

  data-service:
    build:
      context: ./services
      dockerfile: Dockerfile
    container_name: hesperides-data-service
    environment:
      DATA_SERVICE_PORT: ${DATA_SERVICE_PORT:-5001}
    networks:
      - hesperides-net

networks:
  hesperides-net:
    driver: bridge

volumes:
  pgdata:
