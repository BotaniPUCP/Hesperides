spring:
  application:
    name: hesperides-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:hesperides}
    username: ${POSTGRES_USER:hesperides}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # out-of-order se queda en false (el valor por defecto) a proposito: la
    # numeracion es cronologica (REGLAS.md §4), asi que una migracion nueva
    # siempre va al final y nunca aterriza por debajo de lo ya aplicado. Si
    # alguna vez hiciera falta activarlo, es senal de que alguien se salto la
    # convencion y tomo un numero ya usado.
    locations: classpath:db/migration
  servlet:
    multipart:
      # Una carga de catastro trae el CSV y un ZIP de fotos (SPEC-103 §3.1). Las
      # fotos ya vienen comprimidas, así que el ZIP pesa casi lo mismo que ellas.
      # 250 MB por subida (SPEC-104 D-07); el frontend lo repite en upload-limits.ts.
      max-file-size: 250MB
      max-request-size: 250MB
  mvc:
    # Required so unmapped routes raise NoHandlerFoundException and reach the
    # global handler as 404 instead of falling through to a generic 500.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  data:
    web:
      pageable:
        # Serializa Page como {content, page:{number,size,totalElements,totalPages}}
        # en vez de volcar los campos en la raiz junto a pageable y sort. Spring
        # declara esa forma plana inestable entre versiones, y es la forma que el
        # tipo Page<T> de shared/types ya describe: sin esto el tipo miente y el
        # paginador del frontend lee undefined sin que TypeScript lo advierta.
        serialization-mode: via-dto
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.ssl.trust: "*"
      mail.smtp.ssl.checkserveridentity: false
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      # Sin timeouts, un SMTP que no responde cuelga el hilo de la petición
      # indefinidamente y el administrador no recibe respuesta del alta.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
server:
  port: ${BACKEND_PORT:8080}

hesperides:
  security:
    jwt:
      # Sin valor por defecto: si falta la variable, la aplicación no arranca
      # (fail fast). Una clave por defecto en el código es una puerta abierta.
      secret: ${JWT_SECRET}
      access-token-validity-seconds: 1800
      refresh-token-validity-days: 7
    cookie:
      # En desarrollo local no hay HTTPS, así que la cookie no puede ser Secure
      # o el navegador la descarta. En producción se sobreescribe a true.
      secure: ${COOKIE_SECURE:false}
    login:
      max-attempts: 5
      window-minutes: 15
    cors:
      # Lista cerrada y separada por comas. Nunca un comodín: con credenciales
      # activas el propio navegador rechaza esa combinación, y permitiría que
      # cualquier sitio llamara a esta API con la cookie del usuario.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:no-reply@hesperides.local}
    # Nunca se arma esta URL con el header Host del request: quien controle ese
    # header haría que el correo apunte a un dominio suyo (SPEC-100 §4).
    # Sin valor por defecto: un default de desarrollo acabaria enviando correos
    # que invitan a entrar en localhost, que no significa nada para quien lo recibe.
    app-public-url: ${APP_PUBLIC_URL}
  # Fotos y archivos (SPEC-002 §5.4): local en desarrollo y on-premise, s3 en
  # AWS. El directorio no tiene valor por defecto: guardar fotos en un lugar
  # que se borra al reiniciar es peor que no arrancar.
  storage:
    type: ${STORAGE_TYPE:local}
    local-dir: ${STORAGE_LOCAL_DIR:}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-region: ${STORAGE_S3_REGION:}
    # Bandeja de carga inicial de fotos de especie (SPEC-104 D-05). Opcional: sin
    # ella el endpoint load-inbox responde 422 y el resto del sistema no cambia.
    inbox-dir: ${STORAGE_INBOX_DIR:}
