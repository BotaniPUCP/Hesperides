spring:
  application:
    name: hesperides-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:hesperides}
    username: ${POSTGRES_USER:hesperides}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    # Required so unmapped routes raise NoHandlerFoundException and reach the
    # global handler as 404 instead of falling through to a generic 500.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
server:
  port: ${BACKEND_PORT:8080}

hesperides:
  security:
    jwt:
      # Sin valor por defecto: si falta la variable, la aplicación no arranca
      # (fail fast). Una clave por defecto en el código es una puerta abierta.
      secret: ${JWT_SECRET}
      access-token-validity-seconds: 1800
      refresh-token-validity-days: 7
    cookie:
      # En desarrollo local no hay HTTPS, así que la cookie no puede ser Secure
      # o el navegador la descarta. En producción se sobreescribe a true.
      secure: ${COOKIE_SECURE:false}
    login:
      max-attempts: 5
      window-minutes: 15
